name: Deploy Frontend

# Déploiement FTPS via lftp : build statique Nuxt puis upload fiable vers le
# docroot. Compte FTP chrooté sur ~/commanderbuilder, cible /www/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # playwright n'est qu'un outil local (captures landing) : pas besoin de
        # télécharger les navigateurs pendant le déploiement.
        run: cd frontend && npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Run unit tests
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npx nuxt generate
        env:
          NUXT_PUBLIC_API_BASE: https://api.commanderbuilder.fr/api
          NUXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ vars.HCAPTCHA_SITE_KEY || '10000000-ffff-ffff-ffff-000000000001' }}

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload du build via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # CMDS en quotes simples : littéral. bash substitue les identifiants
          # dans les arguments de connexion. L'ancienne forme passait « $FTP_HOST »
          # littéral à lftp → « Name or service not known ».
          CMDS='set ftp:ssl-allow true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 5; set net:timeout 30; set net:reconnect-interval-base 5; set mirror:parallel-transfer-count 2; mirror -R --delete --verbose ./frontend/.output/public/ /www/; bye'
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "$CMDS"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Attendre la propagation
        run: sleep 30
      - name: Smoke tests frontend
        run: |
          URL="https://commanderbuilder.fr"
          # Après un `mirror --delete`, O2Switch peut renvoyer des 502/503
          # transitoires le temps de se recharger : on réessaie ~3 min avant
          # de conclure à un échec, pour ne pas passer en rouge à tort.
          check() {
            local path="$1" status
            for attempt in $(seq 1 12); do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path" || true)
              if [ "$status" = "200" ]; then
                echo "✓ $path (200)"
                return 0
              fi
              echo "  $path → $status (tentative $attempt/12), nouvel essai dans 15s…"
              sleep 15
            done
            echo "FAIL $path : dernier code = $status"
            return 1
          }
          check "/" || exit 1
          check "/manifest.webmanifest" || exit 1
          echo "✅ Front OK"
